app:
  host: 127.0.0.1
  port: 8000

log:
  level: INFO

# ── AI 接入层（方案 §8）────────────────────────
# 默认指向 mock provider：零配置首启即可演示完整治理链路。
#
# 接入自己的模型：打开「设置 · 模型后端」，用接入表单新增一个 provider 并录入 Key
# （Key 写入 Windows 凭据管理器，不落配置文件）。表单写入的就是本文件同名的键，
# 只是存放在用户 config.yaml 里并深度覆盖此处。
#
# provider 配置字段（对应设置页的接入表单）：
#   type          mock / openai_compat        必填
#   base_url      OpenAI 兼容端点根地址        非 mock 必填
#   models        可用模型 ID 列表             必填
#   vendor        厂商标识                     必填（critique 档据此做跨厂商校验）
#   api_key_ref   凭据管理器引用名             可留空 = 该端点无需鉴权
#   capabilities  json_object/tools/stream/vision
#   price         每 1K token 的 {input, output} 单价
#   timeout_s     覆盖默认超时（秒）
#   extra_headers / extra_body  透传字段
#   delay_ms      仅 mock：真实睡眠的毫秒数，用来模拟长任务（验证流式进度）
ai:
  providers:
    mock:
      type: mock
      models: [mock-small]
      vendor: mock
      # mock 确实支持工具调用（按 `tool_script` 产确定性调用），所以能力清单里必须有
      # `tools`。少了它，内核循环的带工具请求会在降级链上被逐个跳过，最终报
      # 「无可用模型后端」—— 那是**配置**问题，却长成了「后端全挂了」的样子。
      capabilities: [json_object, tools]
      price: {input: 0.0, output: 0.0}
      # 内核循环（US-405）的空转脚本：第 N 次调用吐出第 N 条工具调用，用尽后回到普通文本作答，
      # 于是会话会自己结束。用法见 docs / tmp 下的内核冒烟脚本；生产端点不需要这一段。
      tool_script: []
      response: '{"questions": [{"question": "如何提升图神经网络推荐模型的可解释性", "rationale": "现有 GNN 推荐方法决策过程不透明，缺乏可解释性研究", "score": 0.82}, {"question": "图神经网络推荐系统中的过平滑问题的缓解策略", "rationale": "层数加深导致性能下降，是 GNN 推荐的主要瓶颈", "score": 0.75}, {"question": "基于对比学习的图神经网络冷启动推荐", "rationale": "冷启动场景下结构信息利用不足", "score": 0.68}]}'
  routing:
    extract:    [{provider: mock, model: mock-small}]
    plan:       [{provider: mock, model: mock-small}]
    critique:   [{provider: mock, model: mock-small}]
    synthesize: [{provider: mock, model: mock-small}]
    write:      [{provider: mock, model: mock-small}]
  budget:
    project_total: 50.0   # 单项目总额（元）
    project_daily: 10.0   # 单项目每日额度（元）
    # 批准预算熔断后追加的额度（有效限额 = 配置限额 + 未过期豁免）。
    # 审批单会带出建议值，用户在审批时可覆盖。
    approval_grant:
      project_total: 50.0
      project_daily: 10.0
      agent_steps: 20
      agent_cost: 2.0
  circuit:
    failure_threshold: 5  # 连续失败次数 → 熔断
    cooldown_seconds: 300 # 冷却时长（秒）

  # 模型响应缓存（FIX-05）：落 llm_cache 表，跨重启有效。
  # 键由 (provider, model, tier, messages, schema) 规范化哈希得到。
  cache:
    enabled: true
    ttl_seconds: 604800   # 7 天

# ── 内核循环（US-405）──────────────────────────
# 会话里「用户说一句 → 内核决定做什么 → 调工具 → 回填结果」这条路径的参数。
# 全部可省：缺省值见 app/agent_kernel/loop.py 的模块常量。
kernel:
  max_steps: 20        # 单次运行的最大轮数（每轮 = 一次模型调用）。AgentSpec.max_steps 的全局覆盖
  parallel: true       # 同轮多个**只读**工具并发执行；deterministic 模式下强制关闭（D7）
  budget_tokens: 8192  # 单次上下文装配的 token 预算（裁剪梯队见 D8）
  recent_turns: 8      # 保留最近多少轮完整对话，更早的摘要化
  max_tokens: 1024     # 单次模型调用的输出上限

# ── 沙箱（US-406）──────────────────────────────
# D6 的第一版边界：只做可验证的最小面。根目录固定为 <数据目录>/workspace，
# 项目产物各自隔离在 workspace/project-<id>/ 之下，这里不提供「换根」的开关 ——
# 一个能改沙箱根目录的配置项，等于把白名单交给配置文件。
# 能力与未实现项见 `GET /api/sandbox`，改这里的值不会改变那张清单。
sandbox:
  timeout_s: 30            # 子进程硬超时（秒）；工具自身声明的 timeout_s 只能调小
  max_output_bytes: 65536   # 单次命令/文件的输出上限（字节），超限保留头尾并写明丢了多少
  network: false            # 声明式：本版**不做**进程级网络隔离，这一位只用于展示与审计
